<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    lucide.createIcons();

    // ==========================================
    // 1. 全域常數與狀態
    // ==========================================
    const MY_LIFF_ID = "2008934010-6z7iElYg";
    const API_BASE_URL = "https://deeplearning101-api-ciecietaipei.hf.space";

    const DINE_IN_HOURS = { start: 18.5, end_weekday: 25.5, end_weekend: 26.5 };

    let state = { view: 1, service: null, pax: 2, lineId: "" };

    // ==========================================
    // 2. 系統初始化與 Webhook 攔截
    // ==========================================
    document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const action = urlParams.get('action');
        if (action) { handleUrlWebhook(urlParams); return; }
        initLiff();
        initDateSelect();
    });

    function handleUrlWebhook(urlParams) {
        const action = urlParams.get('action');
        document.getElementById('view1').classList.add('hidden-view');
        document.getElementById('confirmationView').classList.remove('hidden-view');

        setTimeout(() => {
            document.getElementById('confirmLoading').classList.add('hidden-view');
            document.getElementById('confirmSuccess').classList.remove('hidden-view');

            if (action === 'confirm') {
                document.getElementById('confirmTitle').innerText = '已成功確認出席！';
                document.getElementById('confirmDesc').innerText = '感謝您的回覆，我們已記錄您的確認，期待為您服務。';
            } else if (action === 'cancel') {
                document.getElementById('confirmTitle').innerText = '訂位已取消';
                document.getElementById('confirmTitle').classList.replace('text-gold-500', 'text-red-500');
                document.getElementById('confirmDesc').innerText = '已為您取消本次預約，期待下次能為您服務。';
                document.getElementById('confirmIcon').setAttribute('data-lucide', 'x-circle');
                document.getElementById('confirmIcon').classList.replace('text-green-500', 'text-red-500');
            }
            lucide.createIcons();
        }, 1000);
    }

    async function initLiff() {
        const statusDiv = document.getElementById('liffStatus');
        try {
            await liff.init({ liffId: MY_LIFF_ID });
            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                state.lineId = profile.userId;
                statusDiv.innerText = `✅ LINE 綁定成功`;
                statusDiv.classList.add('text-green-500');
            } else {
                statusDiv.innerText = `ℹ️ 訪客模式 (未登入 LINE)`;
            }
        } catch (err) {
            statusDiv.innerText = `⚠️ 訪客模式`;
        }
    }

    function initDateSelect() {
        const dateSelect = document.getElementById('dateSelect');
        const today = new Date();
        const weekdays = ["(日)", "(一)", "(二)", "(三)", "(四)", "(五)", "(六)"];
        let html = '';
        for (let i = 0; i < 30; i++) {
            let d = new Date(today);
            d.setDate(today.getDate() + i);
            let y = d.getFullYear();
            let m = String(d.getMonth() + 1).padStart(2, '0');
            let day = String(d.getDate()).padStart(2, '0');
            html += `<option value="${y}-${m}-${day}">${y}-${m}-${day} ${weekdays[d.getDay()]}</option>`;
        }
        dateSelect.innerHTML = html;
        updateTimeSlots();
    }

    function updateTimeSlots() {
        const dateSelect = document.getElementById('dateSelect');
        const timeSelect = document.getElementById('timeSelect');
        if (!dateSelect.value) return;

        const selectedDate = new Date(dateSelect.value);
        const now = new Date();
        const isToday = (dateSelect.value === `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`);
        const isWeekend = (selectedDate.getDay() === 0 || selectedDate.getDay() === 6);

        const endHour = isWeekend ? DINE_IN_HOURS.end_weekend : DINE_IN_HOURS.end_weekday;
        let slots = [];
        for (let v = DINE_IN_HOURS.start; v <= endHour; v += 0.5) {
            slots.push({
                display: `${String(Math.floor(v) % 24).padStart(2, '0')}:${(v % 1 !== 0) ? '30' : '00'}`,
                val: v
            });
        }

        if (isToday) {
            const currentVal = now.getHours() + (now.getMinutes() / 60);
            if (now.getHours() >= 0 && now.getHours() < 5) {
                slots = slots.filter(s => s.val >= DINE_IN_HOURS.start);
            } else {
                slots = slots.filter(s => s.val > (currentVal + 0.5));
            }
        }

        if (slots.length === 0) {
            timeSelect.innerHTML = `<option value="">-- 該日已無可選時段 --</option>`;
            timeSelect.disabled = true;
        } else {
            timeSelect.innerHTML = slots.map(s => `<option value="${s.display}">${s.display}</option>`).join('');
            timeSelect.disabled = false;
        }
        updateBottomBar();
    }

    function selectService(type) {
        state.service = type;
        state.pax = 2;
        state.view = 2;
        updatePaxDisplay();
        updateTimeSlots();
        updateView();
    }

    function goBack() {
        state.view = 1;
        state.service = null;
        updateView();
    }

    function updateView() {
        document.getElementById('view1').classList.toggle('hidden-view', state.view !== 1);
        document.getElementById('view2').classList.toggle('hidden-view', state.view !== 2);
        const navBar = document.getElementById('navBar');
        if (state.view === 1) {
            navBar.classList.add('hidden-view');
        } else {
            navBar.classList.remove('hidden-view');
            document.getElementById('navTitle').innerText = '填寫訂位資訊';
        }
        updateBottomBar();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    const MAX_ONLINE_PAX = 4;

    function adjustPax(delta) {
        const newPax = state.pax + delta;
        if (newPax >= 1 && newPax <= MAX_ONLINE_PAX) {
            state.pax = newPax;
            updatePaxDisplay();
            updateBottomBar();
        }
    }

    function updatePaxDisplay() {
        document.getElementById('paxDisplay').innerText = state.pax;
        const atMax = state.pax >= MAX_ONLINE_PAX;
        const plusBtn = document.getElementById('paxPlusBtn');
        plusBtn.disabled = atMax;
        plusBtn.classList.toggle('opacity-30', atMax);
        plusBtn.classList.toggle('cursor-not-allowed', atMax);
        document.getElementById('paxWarning').classList.toggle('hidden-view', !atMax);
    }

    function updateBottomBar() {
        const bar = document.getElementById('bottomBar');
        if (state.view === 1) { bar.classList.add('hidden-view'); return; }
        bar.classList.remove('hidden-view');

        const dateEl = document.getElementById('dateSelect');
        const timeEl = document.getElementById('timeSelect');
        const date = dateEl ? dateEl.value : '';
        const time = timeEl ? timeEl.value : '';
        const summaryInfo = document.getElementById('summaryInfo');
        summaryInfo.innerText = date && time ? `${date} ${time}｜${state.pax} 位` : `${state.pax} 位`;
    }

    function validateForm() {
        const name = document.getElementById('custName').value.trim();
        const tel = document.getElementById('custTel').value.trim();
        const timeEl = document.getElementById('timeSelect');
        const time = timeEl ? timeEl.value : '';
        if (!name || !tel || !time) {
            alert("⚠️ 請完整填寫姓名與電話，並確保已選擇時段。");
            return false;
        }
        if ((tel.match(/\d/g) || []).length < 6) {
            alert("⚠️ 電話號碼格式錯誤。");
            return false;
        }
        return true;
    }

    /* =====================================================
     * 停用功能保留區 — 未來若需重新啟用可解除註解
     * =====================================================

    // ── LINE Pay URL Webhook handlers ──
    // 當 ?action=payment_confirm / payment_cancel / repay 時觸發
    // 需搭配 API-CIECIETAIPEI main.py 的 LINE Pay 端點一起重新啟用

    function handlePaymentConfirm(urlParams) {
        const orderId = urlParams.get('orderId');
        const amount  = urlParams.get('amount');
        if (!orderId || !amount) { showError('付款參數錯誤'); return; }
        fetch(`${API_BASE_URL}/api/linepay/confirm`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ transaction_id: '', order_id: orderId, amount: parseInt(amount) })
        }).then(r => r.json()).then(data => {
            if (data.status === 'success') showConfirmSuccess('付款成功！訂位已確認。');
            else showError('付款確認失敗：' + (data.detail || '未知錯誤'));
        }).catch(e => showError('連線失敗：' + e.message));
    }

    async function handleRepay(urlParams) {
        const orderId = urlParams.get('order_id');
        if (!orderId) { showError('訂單號碼錯誤'); return; }
        try {
            const r = await fetch(`${API_BASE_URL}/api/linepay/repay`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order_id: orderId })
            });
            const data = await r.json();
            if (data.payment_url) window.location.href = data.payment_url;
            else showError('無法取得付款連結：' + (data.detail || '未知錯誤'));
        } catch(e) { showError('連線失敗：' + e.message); }
    }

    // ── 預點餐 / 菜單相關（view3）──
    // 需搭配 API-CIECIETAIPEI main.py 的 /api/inventory 端點一起重新啟用

    let cart = {};
    let menuData = [];

    async function fetchMenuData(date) {
        try {
            const [menuRes, invRes] = await Promise.all([
                fetch(`${API_BASE_URL}/api/menu`),
                fetch(`${API_BASE_URL}/api/inventory/${date}`)
            ]);
            menuData = (await menuRes.json()) || [];
            const inv  = (await invRes.json()) || {};
            menuData = menuData.map(item => ({
                ...item,
                remaining: item.daily_limit
                    ? Math.max(0, item.daily_limit - (inv[item.id] || 0))
                    : 999
            }));
        } catch(e) { console.error('fetchMenuData failed:', e); menuData = []; }
    }

    function getMealPeriod() {
        const h = new Date().getHours();
        if (h >= 11 && h < 18.5) return '白天 (11:00-18:30)';
        if (h >= 18.5 && h < 21.5) return '晚餐 (18:30-21:30)';
        return '宵夜 (21:30後)';
    }

    function renderMenu() {
        const period = getMealPeriod();
        const container = document.getElementById('menuContainer');
        if (!container) return;
        const filtered = menuData.filter(i => i.is_active && (!i.available_times || i.available_times.includes(period)));
        if (!filtered.length) { container.innerHTML = '<p class="text-gray-500 text-center">目前時段無可供預點的餐點</p>'; return; }
        container.innerHTML = filtered.map(item => `
            <div class="bg-dark-800 border border-dark-700 rounded-xl p-4 flex items-center gap-4">
                ${item.image_url ? `<img src="${item.image_url}" class="w-16 h-16 rounded-lg object-cover flex-shrink-0" onerror="this.style.display='none'">` : ''}
                <div class="flex-1 min-w-0">
                    <div class="font-bold text-white truncate">${item.name}</div>
                    <div class="text-xs text-gray-500 truncate">${item.description || ''}</div>
                    <div class="text-gold-500 font-bold mt-1">$${item.price}</div>
                    ${item.remaining < 999 ? `<div class="text-xs text-rose-400">剩 ${item.remaining} 份</div>` : ''}
                </div>
                <div class="flex items-center gap-2 flex-shrink-0">
                    <button onclick="addToCart('${item.id}', -1)" class="w-8 h-8 bg-dark-700 rounded-md text-white flex items-center justify-center">-</button>
                    <span class="w-6 text-center font-bold text-white" id="qty_${item.id}">${cart[item.id] || 0}</span>
                    <button onclick="addToCart('${item.id}', 1, ${item.remaining})" class="w-8 h-8 bg-dark-700 rounded-md text-white flex items-center justify-center">+</button>
                </div>
            </div>`).join('');
    }

    function addToCart(itemId, delta, maxQty = 999) {
        const cur = cart[itemId] || 0;
        const next = Math.max(0, Math.min(cur + delta, maxQty));
        if (next === 0) delete cart[itemId]; else cart[itemId] = next;
        const el = document.getElementById('qty_' + itemId);
        if (el) el.innerText = next;
        renderCartList();
        updateBottomBar();
    }

    function renderCartList() {
        const section = document.getElementById('cartSection');
        const list    = document.getElementById('cartList');
        if (!section || !list) return;
        const items = Object.entries(cart).filter(([,q]) => q > 0);
        section.classList.toggle('hidden-view', items.length === 0);
        list.innerHTML = items.map(([id, qty]) => {
            const item = menuData.find(m => m.id === id);
            if (!item) return '';
            return `<div class="flex justify-between items-center text-sm">
                <span class="text-white">${item.name} × ${qty}</span>
                <span class="text-gold-500">$${item.price * qty}</span>
            </div>`;
        }).join('');
    }

    function togglePreorder(show) {
        document.getElementById('view3').classList.toggle('hidden-view', !show);

    async function handleMainAction() {
        if (!validateForm()) return;

        const btn = document.getElementById('mainActionBtn');
        const originalText = btn.innerText;
        btn.innerHTML = `<i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto text-black"></i>`;
        lucide.createIcons();
        btn.disabled = true;

        const payload = {
            service_type: state.service,
            name: document.getElementById('custName').value,
            tel: document.getElementById('custTel').value,
            email: document.getElementById('custEmail').value,
            remarks: document.getElementById('custRemarks').value,
            date: document.getElementById('dateSelect').value,
            time: document.getElementById('timeSelect').value,
            line_id: state.lineId,
            pax: state.pax
        };

        try {
            const response = await fetch(`${API_BASE_URL}/api/submit_booking`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                let errorMsg = `HTTP ${response.status}`;
                try {
                    const errorData = await response.json();
                    errorMsg = errorData.detail || errorMsg;
                } catch (e) {
                    errorMsg = await response.text() || errorMsg;
                }
                throw new Error(errorMsg);
            }

            const result = await response.json();

            if (result.status === 'success') {
                document.getElementById('view2').classList.add('hidden-view');
                document.getElementById('navBar').classList.add('hidden-view');
                document.getElementById('bottomBar').classList.add('hidden-view');
                document.getElementById('confirmationView').classList.remove('hidden-view');
                document.getElementById('confirmLoading').classList.add('hidden-view');
                document.getElementById('confirmSuccess').classList.remove('hidden-view');
                document.getElementById('confirmTitle').innerText = '訂位申請已送出！';
                document.getElementById('confirmDesc').innerText = '我們將盡快與您確認，請留意 Email 或 LINE 通知，感謝您。';
                lucide.createIcons();
            } else {
                throw new Error(result.detail || '發生未知錯誤');
            }
        } catch (error) {
            alert(`❌ 送出失敗：${error.message}`);
            btn.innerHTML = originalText;
            btn.disabled = false;
            lucide.createIcons();
        }
    }
</script>
